name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  theme-check:
    name: Shopify Theme Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Theme Check
        uses: shopify/theme-check-action@v1
        with:
          token: ${{ secrets.THEME_CHECK_TOKEN }}
